name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Each run derives its tags from the commits since the last ones, so two runs
# must not compute from the same base. A running release is never cancelled;
# a newer queued run supersedes an older queued one, and since versions are
# computed from every commit since the last tag, it releases both pushes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # One module refusing to release (see next-version.sh) must not cancel
      # another between pushing its tag and creating its release.
      fail-fast: false
      matrix:
        module: [common, echo, gin]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag next-version.sh bumps from, so the release notes cover exactly
      # the commits the new version was computed from.
      - name: Get latest module tag
        id: latest_tag
        run: |
          latest=$(.github/scripts/next-version.sh --base "${{ matrix.module }}")
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"

      # The level comes from Release-As trailers and conventional-commit
      # markers on the commits that touched this module; see
      # .github/scripts/next-version.sh and its test for the rules.
      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          next=$(.github/scripts/next-version.sh "${{ matrix.module }}")
          if [ "$next" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=${next}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.version.outputs.skip != 'true'
        id: notes
        run: |
          prev_tag="${{ steps.latest_tag.outputs.tag }}"
          if [ -n "$prev_tag" ] && git rev-parse "$prev_tag" >/dev/null 2>&1; then
            log=$(git log "${prev_tag}..HEAD" --pretty=format:"- %s (%h)" --no-merges -- ${{ matrix.module }}/)
          else
            log=$(git log --pretty=format:"- %s (%h)" --no-merges -- ${{ matrix.module }}/)
          fi
          {
            echo "notes<<EOF"
            echo "$log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body: ${{ steps.notes.outputs.notes }}
